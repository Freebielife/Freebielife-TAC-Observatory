name: TAC visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/icon-pack/**'
      - 'project.json'
      - 'observatory.py'
      - 'trade_history.py'
      - 'scripts/**'
      - 'tests/tac_site_browser.py'
      - '.github/workflows/tac-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tac-flags-qa
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and standalone HTML checks
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          node --check web/app.js
          node --test tests/*.test.cjs
          python3 build.py
          python3 verify.py
      - name: Install Chromium QA runner
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Responsive visual and link checks
        run: python3 tests/tac_site_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tac-qa-flags-and-services
          path: build/tac-qa/
          if-no-files-found: ignore
          retention-days: 14
