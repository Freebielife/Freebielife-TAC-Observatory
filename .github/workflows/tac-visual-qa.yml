name: TAC flag and service UI QA
on:
  push:
    branches: [feature/tac-common-flags-service-audit-20261120]
    paths:
      - 'web/**'
      - 'assets/icon-pack/**'
      - 'project.json'
      - 'observatory.py'
      - 'scripts/**'
      - 'tests/tac_site_browser.py'
      - '.github/workflows/tac-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tac-flags-qa
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tac-common-flags-service-audit-20261120
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and standalone HTML checks
        run: |
          node --check web/app.js
          node --test tests/*.test.cjs
          python3 build.py
          python3 verify.py
      - name: Install Chromium QA runner
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Responsive visual and link checks
        run: python3 tests/tac_site_browser.py
      - name: Commit tested HTML to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Build TAC interface with verified common TONecosystem flags'
          git push origin HEAD:feature/tac-common-flags-service-audit-20261120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tac-qa-flags-and-services
          path: build/tac-qa/
          if-no-files-found: ignore
          retention-days: 14
