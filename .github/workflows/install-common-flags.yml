name: Install shared TONecoFlags (one-time)
on:
  push:
    branches: [feature/tac-common-flags-service-audit-20261120]
    paths: ['.github/workflows/install-common-flags.yml']
permissions:
  contents: write
jobs:
  flags:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tac-common-flags-service-audit-20261120
          fetch-depth: 8
      - uses: actions/checkout@v4
        with:
          repository: Freebielife/Ludoman
          ref: 183863540c490846ad6f4e8d296b865d0ea9d2b8
          path: .reference-ludoman
          persist-credentials: false
      - name: Extract only approved common flags from owner sprite
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import json,runpy
          from pathlib import Path
          root=Path(".reference-ludoman")
          util=runpy.run_path(str(root/"scripts/build_common_flags.py"))
          out=util["build_common_atlas"](root/"assets/icon-pack/approved-brand-atlas.json")
          target=Path("assets/icon-pack/approved-brand-atlas.json")
          target.write_text(json.dumps(out,ensure_ascii=False,separators=(",",":")))
          assert "ludoman" not in out["positions"] and "kito" not in out["positions"]
          print("Common TON flags:",sorted(out["positions"]))
          PY
          rm -rf .reference-ludoman
      - name: Build and check offline site
        run: |
          python3 build.py
          python3 verify.py
          node --check web/app.js
          node --test tests/*.test.cjs
      - name: Commit shared atlas and website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icon-pack/approved-brand-atlas.json index.html
          git diff --cached --quiet || git commit -m 'Embed neutral TON ecosystem flags (no foreign token assets)'
          git push origin HEAD:feature/tac-common-flags-service-audit-20261120
